
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    body {
      margin: 0;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      z-index: 1;
    }

    #error {
      color: #fff;
      text-align: center;
      font-size: 20px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <p id="title"></p>
  <p id="error"></p>

  <video id="player" controls playsinline controlsList="nodownload"></video>

  <script>
    const JSON_URL = "./videos.json";
    const DIRECT_LINK = "https://cloakroomreveal.com/xm3t1rxs3q?key=f81d3ab66f4aedf0145980588159a3b1";

    const video = document.getElementById("player");
    const title = document.getElementById("title");
    const error = document.getElementById("error");

    let redirected = false;

    function getVideoId() {
      return decodeURIComponent(location.hash.slice(1))
        .replace(/^\/+/, "")
        .trim();
    }

    async function loadVideo() {
      try {
        const response = await fetch(JSON_URL, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("Gagal mengambil videos.json: " + response.status);
        }

        const data = await response.json();
        const vids = Array.isArray(data) ? data : data.videos;

        if (!Array.isArray(vids) || vids.length === 0) {
          throw new Error("Format videos.json tidak sesuai.");
        }

        const id = getVideoId();
        const selected = vids.find(v => v.id === id);

        if (!selected) {
          throw new Error("ID tidak ditemukan: " + id);
        }

        if (!selected.cdn) {
          throw new Error("URL CDN tidak ditemukan untuk ID: " + id);
        }

        video.src = selected.cdn;
        title.textContent = selected.title || selected.id;
        error.textContent = "";

        video.load();
      } catch (err) {
        title.textContent = "";
        error.textContent = err.message;
        console.error(err);
      }
    }

    video.addEventListener("timeupdate", () => {
      if (!redirected && video.currentTime >= 30) {
        redirected = true;
        window.location.replace(DIRECT_LINK);
      }
    });

    loadVideo();
  </script>

</body>
</html>
