
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    body {
      margin: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <p id="title"></p>

  <video id="player" controls playsinline controlsList="nodownload"></video>

  <script>
    const JSON_URL = "videos.json";
    const DIRECT_LINK = "https://cloakroomreveal.com/xm3t1rxs3q?key=f81d3ab66f4aedf0145980588159a3b1";

    const video = document.getElementById("player");
    const title = document.getElementById("title");

    let redirected = false;

    fetch(JSON_URL)
      .then(res => res.json())
      .then(data => {
        const vids = data.videos;
        const id = decodeURIComponent(location.hash.replace("#", ""));

        let selected = vids.find(v => v.id === id);

        if (!selected) {
          selected = vids[0];
        }

        video.src = selected.cdn;
        title.innerText = selected.title || selected.id;
      });

    video.addEventListener("timeupdate", () => {
      if (!redirected && video.currentTime >= 30) {
        redirected = true;
        window.location.replace(DIRECT_LINK);
      }
    });
  </script>

</body>
</html>
